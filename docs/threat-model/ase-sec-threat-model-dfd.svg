<svg xmlns="http://www.w3.org/2000/svg" width="672" viewBox="0 0 672 944" role="img" aria-labelledby="tm-dfd-title tm-dfd-desc">
  <title id="tm-dfd-title">Datenflussdiagramm: Benutzerkonto und Login im Lagerraum Box-Check</title>
  <desc id="tm-dfd-desc">Julia meldet sich an ihrem Gerät in der Web-App an. Die Web-App schickt Login, Reservierungsänderungen und Passwort-Reset über das Internet an den Reverse Proxy. Der Proxy leitet an das Backend weiter, das Konten, Sitzungen und Reservierungen in der zentralen Datenbank hält und Reset-Links über einen externen E-Mail-Dienst in Julias Postfach schickt. Drei Trust Boundaries: Julias Gerät, Backend im Docker-Netz, Drittanbieter. Neun nummerierte Datenflüsse mit Daten, Protokoll und Identität.</desc>
