  <text class="name" x="16" y="652">Datenflüsse: was · wie · als wer</text>
  <text class="num" x="34" y="674" text-anchor="end">1</text>
  <text class="legend" x="46" y="674">E-Mail-Adresse, Passwort · Eingabe am Gerät · Julia</text>
  <text class="num" x="34" y="696" text-anchor="end">2</text>
  <text class="legend" x="46" y="696">Login, Konto anlegen: E-Mail-Adresse + Passwort · HTTPS · anonym</text>
  <text class="num" x="34" y="718" text-anchor="end">3</text>
  <text class="legend" x="46" y="718">Box-Reservierung lesen, ändern, stornieren · HTTPS · Session-Cookie</text>
  <text class="num" x="34" y="740" text-anchor="end">4</text>
  <text class="legend" x="46" y="740">Reset anfordern, neues Passwort setzen · HTTPS · anonym, dann Einmal-Token</text>
  <text class="num" x="34" y="762" text-anchor="end">5</text>
  <text class="legend" x="46" y="762">Anfragen mit Cookie und Absender-IP weitergereicht · HTTP intern · Proxy</text>
  <text class="num" x="34" y="784" text-anchor="end">6</text>
  <text class="legend" x="46" y="784">Konten, Passwort-Hash, Sitzungen, Reservierungen · SQL · DB-Benutzer der App</text>
  <text class="num" x="34" y="806" text-anchor="end">7</text>
  <text class="legend" x="46" y="806">Mail mit Link (Bestätigung, Reset) · HTTPS-API · API-Schlüssel</text>
  <text class="num" x="34" y="828" text-anchor="end">8</text>
  <text class="legend" x="46" y="828">Mail mit Link · SMTP, TLS nicht garantiert · E-Mail-Dienst</text>
  <text class="num" x="34" y="850" text-anchor="end">9</text>
  <text class="legend" x="46" y="850">Link aus der Mail öffnen · Klick, öffnet die Web-App · Julia</text>
  <text class="mono" x="16" y="880">Pfeil = Richtung der Anfrage, Antworten sind nicht gezeichnet</text>
  <text class="mono" x="16" y="900">Rechteck = externer Akteur · Kreis = Prozess · Zylinder = Datenspeicher</text>
  <text class="mono" x="16" y="920">rot gestrichelt = Trust Boundary · blau = Schwerpunkt TT01</text>
