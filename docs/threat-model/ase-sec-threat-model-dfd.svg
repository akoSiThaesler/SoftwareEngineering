  <text class="note" x="62" y="647">Hier setzt eine Bedrohung an. Die Nummer steht in der Tabelle.</text>
  <text class="note" x="24" y="676">Rechteck = Person oder fremdes System · Kreis = unser Code (blau = Schwerpunkt) · Zylinder = Daten</text>
  <text class="note" x="24" y="696">Rot gestrichelt = Trust Boundary: hier wechselt, wer die Kontrolle hat</text>
