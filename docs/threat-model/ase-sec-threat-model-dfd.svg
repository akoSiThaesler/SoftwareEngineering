<svg xmlns="http://www.w3.org/2000/svg" width="672" viewBox="0 0 672 716" role="img" aria-labelledby="tm-title tm-desc">
  <title id="tm-title">Datenflussdiagramm: Konto und Login in der fertigen App</title>
  <desc id="tm-desc">Julia meldet sich im Browser beim Konto-Dienst an und bekommt ein Token. Mit dem Token ändert sie ihre Reservierung beim Reservierungs-Dienst. Beide Dienste nutzen eine Datenbank und einen Cache. Den Link zum Zurücksetzen des Passworts verschickt der Konto-Dienst über einen fremden E-Mail-Dienst in Julias Postfach. Vier Trust Boundaries: Julias Gerät, unser Server, Drittanbieter, Mail-Anbieter. Gelbe Marken T1 bis T11 zeigen, wo eine Bedrohung ansetzt.</desc>
  <style>
    text { font-family: Barlow, "Segoe UI", system-ui, sans-serif; fill: #171B20; }
    .name { font-size: 15px; font-weight: 700; }
    .sub { font-size: 13px; fill: #515A65; }
    .lbl { font-size: 14px; paint-order: stroke; stroke: #FFFFFF; stroke-width: 5px; stroke-linejoin: round; }
    .num { font-weight: 700; fill: #1F4E8C; }
    .note { font-size: 13px; fill: #515A65; }
    .tb { fill: none; stroke: #A1241F; stroke-width: 1.6; stroke-dasharray: 7 5; }
    .tb-l { font-size: 14px; font-weight: 700; fill: #A1241F; }
    .actor { fill: #E9EBED; stroke: #515A65; stroke-width: 1.4; }
    .proc { fill: #FFFFFF; stroke: #171B20; stroke-width: 1.6; }
    .main { fill: #EDF3FA; stroke: #1F4E8C; stroke-width: 2; }
    .store { fill: #FFFFFF; stroke: #171B20; stroke-width: 1.6; }
    .flow { fill: none; stroke: #515A65; stroke-width: 1.8; }
    .head { fill: #515A65; }
    .chip { fill: #F4C20D; stroke: #171B20; stroke-width: 1.2; }
    .chip-t { font-size: 13px; font-weight: 700; }
  </style>
