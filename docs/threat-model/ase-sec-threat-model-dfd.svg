<svg xmlns="http://www.w3.org/2000/svg" width="672" viewBox="0 0 672 560" role="img" aria-labelledby="tm-dfd-title tm-dfd-desc">
  <title id="tm-dfd-title">Datenflussdiagramm: Konto und Login im Lagerraum Box-Check</title>
  <desc id="tm-dfd-desc">Julia meldet sich im Browser an. Login, Änderungen an der Reservierung und das Zurücksetzen des Passworts gehen über das Internet an unser Backend. Das Backend speichert Konten und Reservierungen in einer Datenbank und verschickt den Link zum Zurücksetzen über einen fremden E-Mail-Dienst in Julias Postfach. Drei Trust Boundaries: Julias Gerät, unser Server, Drittanbieter.</desc>
  <style>
    .paper { fill: #FBFCFE; } .gap { stroke: #FBFCFE; }
    .ink-s { stroke: #252A31; } .ink-f { fill: #252A31; }
    .muted-s { stroke: #636D79; } .muted-f { fill: #636D79; }
    .soft-s { stroke: #98A1AC; }
    .input { fill: #F0F3F7; stroke: #98A1AC; }
    .acc { fill: #E8EDF8; stroke: #1C3D96; } .acc-f { fill: #1C3D96; }
    .name { fill: #252A31; font: 600 15px Bahnschrift, "Segoe UI", sans-serif; }
    .name-s { fill: #252A31; font: 600 14px Bahnschrift, "Segoe UI", sans-serif; }
    .name-acc { fill: #1C3D96; font: 600 15px Bahnschrift, "Segoe UI", sans-serif; }
    .mono { fill: #636D79; font: 400 13px "Cascadia Mono", Consolas, monospace; }
    .aside { fill: #636D79; font: italic 400 15px "Sitka Text", Georgia, serif; }
    .num { fill: #252A31; font: 600 13px "Cascadia Mono", Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #1F2E28; } .gap { stroke: #1F2E28; }
      .ink-s { stroke: #E1E7DE; } .ink-f { fill: #E1E7DE; }
      .muted-s { stroke: #9BAAA0; } .muted-f { fill: #9BAAA0; }
      .soft-s { stroke: #6F8177; }
      .input { fill: #26372F; stroke: #6F8177; }
      .acc { fill: #2A3D46; stroke: #A9C9F1; } .acc-f { fill: #A9C9F1; }
      .name, .name-s { fill: #E1E7DE; } .name-acc { fill: #A9C9F1; }
      .mono, .aside { fill: #9BAAA0; } .num { fill: #E1E7DE; }
    }
  </style>
  <style>
    .tb { fill: none; stroke: #B3261E; } .tb-f { fill: #B3261E; font: 600 14px Bahnschrift, "Segoe UI", sans-serif; }
    .lbl { fill: #252A31; font: 400 14px Bahnschrift, "Segoe UI", sans-serif; }
    .lbl-b { fill: #252A31; font: 600 14px Bahnschrift, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .tb { stroke: #F0A29B; } .tb-f { fill: #F0A29B; } .lbl, .lbl-b { fill: #E1E7DE; }
    }
  </style>
  <rect class="paper" x="0" y="0" width="672" height="560"/>
  <rect class="tb" x="40" y="12" width="248" height="104" rx="10" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text class="tb-f" x="52" y="32" text-anchor="start">Julias Gerät</text>
  <rect class="tb" x="40" y="234" width="404" height="236" rx="10" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text class="tb-f" x="52" y="458" text-anchor="start">Unser Server</text>
  <rect class="tb" x="470" y="234" width="190" height="170" rx="10" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text class="tb-f" x="482" y="392" text-anchor="start">Drittanbieter</text>
  <path class="muted-s" d="M160.0,104.0 L160.0,262.0" fill="none" stroke-width="1.8"/>
  <polygon class="muted-f" points="160.0,262.0 155.8,252.9 164.2,252.9"/>
  <path class="muted-s" d="M216.0,318.0 L252.0,318.0" fill="none" stroke-width="1.8"/>
  <polygon class="muted-f" points="252.0,318.0 242.9,322.2 242.9,313.8"/>
  <path class="muted-s" d="M160.0,374.0 L160.0,420.0 Q160.0,428.0 168.0,428.0 L558.0,428.0 Q566.0,428.0 566.0,420.0 L566.0,368.0" fill="none" stroke-width="1.8"/>
  <polygon class="muted-f" points="566.0,368.0 570.2,377.1 561.8,377.1"/>
  <path class="muted-s" d="M566.0,268.0 L566.0,104.0" fill="none" stroke-width="1.8"/>
  <polygon class="muted-f" points="566.0,104.0 570.2,113.1 561.8,113.1"/>
  <path class="muted-s" d="M470.0,72.0 L270.0,72.0" fill="none" stroke-width="1.8"/>
  <polygon class="muted-f" points="270.0,72.0 279.1,67.8 279.1,76.2"/>
  <text class="lbl" x="178" y="150" text-anchor="start"><tspan class="lbl-b">1</tspan> Anmelden · HTTPS · noch anonym</text>
  <text class="lbl" x="178" y="174" text-anchor="start"><tspan class="lbl-b">2</tspan> Reservierung ändern · HTTPS · Cookie</text>
  <text class="lbl" x="178" y="198" text-anchor="start"><tspan class="lbl-b">3</tspan> Passwort zurücksetzen · HTTPS · Link aus der Mail</text>
  <text class="aside" x="142" y="178" text-anchor="end">Internet</text>
  <text class="lbl" x="334" y="274" text-anchor="middle"><tspan class="lbl-b">4</tspan> Konten, Reservierungen · SQL</text>
  <text class="lbl" x="364" y="420" text-anchor="middle"><tspan class="lbl-b">5</tspan> Mail mit Link · HTTPS · API-Schlüssel</text>
  <text class="lbl" x="578" y="176" text-anchor="start"><tspan class="lbl-b">6</tspan> Mail · SMTP</text>
  <text class="lbl" x="370" y="62" text-anchor="middle"><tspan class="lbl-b">7</tspan> öffnet den Link</text>
  <rect class="input" x="60" y="44" width="210" height="60" stroke-width="1.4"/>
  <text class="name" x="165.0" y="71.0" text-anchor="middle">Julia</text>
  <text class="lbl" x="165.0" y="90.0" text-anchor="middle">im Browser</text>
  <rect class="input" x="470" y="44" width="190" height="60" stroke-width="1.4"/>
  <text class="name" x="565.0" y="71.0" text-anchor="middle">Julias Postfach</text>
  <text class="lbl" x="565.0" y="90.0" text-anchor="middle">bei ihrem E-Mail-Anbieter</text>
  <circle class="acc" cx="160" cy="318" r="56" stroke-width="1.4"/>
  <text class="name-acc" x="160" y="323" text-anchor="middle">Backend</text>
  <circle class="paper ink-s" cx="566" cy="318" r="50" stroke-width="1.4"/>
  <text class="name" x="566" y="314" text-anchor="middle">E-Mail-</text>
  <text class="name" x="566" y="332" text-anchor="middle">Dienst</text>
  <path class="paper ink-s" stroke-width="1.4" d="M252.0,294 V342 A82.0,9 0 0 0 416.0,342 V294 A82.0,9 0 0 0 252.0,294 A82.0,9 0 0 0 416.0,294"/>
  <text class="name" x="334" y="319" text-anchor="middle">Datenbank</text>
  <text class="lbl" x="334" y="337" text-anchor="middle">Konten · Reservierungen</text>
  <text class="mono" x="40" y="516">Rechteck = Person oder fremdes System · Kreis = unser Code · Zylinder = Daten</text>
  <text class="mono" x="40" y="536">rot gestrichelt = Trust Boundary: hier wechselt, wer die Kontrolle hat</text>
</svg>
