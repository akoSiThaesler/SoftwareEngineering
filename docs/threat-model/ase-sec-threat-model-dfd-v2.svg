<svg xmlns="http://www.w3.org/2000/svg" width="672" viewBox="0 0 672 1024" role="img" aria-labelledby="tm-dfd-v2-title tm-dfd-v2-desc">
  <title id="tm-dfd-v2-title">Datenflussdiagramm Version 2: Token, zwei Dienste und Cache</title>
  <desc id="tm-dfd-v2-desc">Ausblick auf Version 2. Die Web-App meldet sich über den Reverse Proxy beim Konto-Dienst an und erhält ein kurzlebiges Access-Token (JWT) und ein Refresh-Cookie. Der Reservierungs-Dienst prüft das Token selbst. Der Konto-Dienst hält Konten und Refresh-Token in der zentralen Datenbank, beide Dienste nutzen einen Cache für Fehlversuchs-Zähler, eine Sperrliste widerrufener Token und die Verfügbarkeit. Zwei Trust Boundaries: Julias Gerät und das Backend. Zehn nummerierte Datenflüsse.</desc>
