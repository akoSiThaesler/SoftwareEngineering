<svg xmlns="http://www.w3.org/2000/svg" width="672" viewBox="0 0 672 624" role="img" aria-labelledby="tm-dfd-v2-title tm-dfd-v2-desc">
  <title id="tm-dfd-v2-title">Datenflussdiagramm Version 2: Token, zwei Dienste, Cache</title>
  <desc id="tm-dfd-v2-desc">Ausblick. Julia meldet sich beim Konto-Dienst an und bekommt ein Token (JWT). Mit dem Token ändert sie ihre Reservierung beim Reservierungs-Dienst, der das Token selbst prüft. Beide Dienste nutzen dieselbe Datenbank und einen Cache für Fehlversuche und gesperrte Token.</desc>
  <style>
    .paper { fill: #FBFCFE; } .gap { stroke: #FBFCFE; }
    .ink-s { stroke: #252A31; } .ink-f { fill: #252A31; }
    .muted-s { stroke: #636D79; } .muted-f { fill: #636D79; }
    .soft-s { stroke: #98A1AC; }
    .input { fill: #F0F3F7; stroke: #98A1AC; }
    .acc { fill: #E8EDF8; stroke: #1C3D96; } .acc-f { fill: #1C3D96; }
    .name { fill: #252A31; font: 600 15px Bahnschrift, "Segoe UI", sans-serif; }
    .name-s { fill: #252A31; font: 600 14px Bahnschrift, "Segoe UI", sans-serif; }
    .name-acc { fill: #1C3D96; font: 600 15px Bahnschrift, "Segoe UI", sans-serif; }
    .mono { fill: #636D79; font: 400 13px "Cascadia Mono", Consolas, monospace; }
    .aside { fill: #636D79; font: italic 400 15px "Sitka Text", Georgia, serif; }
    .num { fill: #252A31; font: 600 13px "Cascadia Mono", Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #1F2E28; } .gap { stroke: #1F2E28; }
      .ink-s { stroke: #E1E7DE; } .ink-f { fill: #E1E7DE; }
      .muted-s { stroke: #9BAAA0; } .muted-f { fill: #9BAAA0; }
      .soft-s { stroke: #6F8177; }
      .input { fill: #26372F; stroke: #6F8177; }
      .acc { fill: #2A3D46; stroke: #A9C9F1; } .acc-f { fill: #A9C9F1; }
      .name, .name-s { fill: #E1E7DE; } .name-acc { fill: #A9C9F1; }
      .mono, .aside { fill: #9BAAA0; } .num { fill: #E1E7DE; }
    }
  </style>
  <style>
    .tb { fill: none; stroke: #B3261E; } .tb-f { fill: #B3261E; font: 600 14px Bahnschrift, "Segoe UI", sans-serif; }
    .lbl { fill: #252A31; font: 400 14px Bahnschrift, "Segoe UI", sans-serif; }
    .lbl-b { fill: #252A31; font: 600 14px Bahnschrift, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .tb { stroke: #F0A29B; } .tb-f { fill: #F0A29B; } .lbl, .lbl-b { fill: #E1E7DE; }
    }
  </style>
  <rect class="paper" x="0" y="0" width="672" height="624"/>
  <rect class="tb" x="40" y="12" width="592" height="104" rx="10" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text class="tb-f" x="52" y="32" text-anchor="start">Julias Gerät</text>
  <rect class="tb" x="40" y="222" width="592" height="306" rx="10" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text class="tb-f" x="620" y="244" text-anchor="end">Unser Server</text>
  <path class="muted-s" d="M150.0,104.0 L150.0,244.0" fill="none" stroke-width="1.8"/>
  <polygon class="muted-f" points="150.0,244.0 145.8,234.9 154.2,234.9"/>
  <path class="muted-s" d="M450.0,104.0 L450.0,244.0" fill="none" stroke-width="1.8"/>
  <polygon class="muted-f" points="450.0,244.0 445.8,234.9 454.2,234.9"/>
  <path class="muted-s" d="M130.0,352.3 L130.0,410.0" fill="none" stroke-width="1.8"/>
  <polygon class="muted-f" points="130.0,410.0 125.8,400.9 134.2,400.9"/>
  <path class="muted-s" d="M180.0,347.3 L180.0,372.0 Q180.0,380.0 188.0,380.0 L402.0,380.0 Q410.0,380.0 410.0,388.0 L410.0,410.0" fill="none" stroke-width="1.8"/>
  <polygon class="muted-f" points="410.0,410.0 405.8,400.9 414.2,400.9"/>
  <path class="muted-s" d="M470.0,352.3 L470.0,410.0" fill="none" stroke-width="1.8"/>
  <polygon class="muted-f" points="470.0,410.0 465.8,400.9 474.2,400.9"/>
  <path class="muted-s" d="M506.0,300.0 L596.0,300.0 Q604.0,300.0 604.0,308.0 L604.0,498.0 Q604.0,506.0 596.0,506.0 L138.0,506.0 Q130.0,506.0 130.0,498.0 L130.0,476.0" fill="none" stroke-width="1.8"/>
  <polygon class="muted-f" points="130.0,476.0 134.2,485.1 125.8,485.1"/>
  <text class="lbl" x="166" y="150" text-anchor="start"><tspan class="lbl-b">1</tspan> Anmelden · HTTPS · anonym</text>
  <text class="lbl" x="166" y="172">zurück kommt ein Token (JWT)</text>
  <text class="lbl" x="466" y="150" text-anchor="start"><tspan class="lbl-b">2</tspan> Reservierung ändern</text>
  <text class="lbl" x="466" y="172">HTTPS · mit Token</text>
  <text class="lbl" x="466" y="194">Token wird hier geprüft</text>
  <text class="aside" x="134" y="194" text-anchor="end">Internet</text>
  <text class="lbl" x="122" y="392" text-anchor="end"><tspan class="lbl-b">3</tspan> Konten</text>
  <text class="lbl" x="296" y="372" text-anchor="middle"><tspan class="lbl-b">4</tspan> Fehlversuche, gesperrte Token</text>
  <text class="lbl" x="482" y="392" text-anchor="start"><tspan class="lbl-b">5</tspan> Token gesperrt?</text>
  <text class="lbl" x="367" y="500" text-anchor="middle"><tspan class="lbl-b">6</tspan> Reservierungen · SQL</text>
  <rect class="input" x="60" y="44" width="552" height="60" stroke-width="1.4"/>
  <text class="name" x="336.0" y="71.0" text-anchor="middle">Julia</text>
  <text class="lbl" x="336.0" y="90.0" text-anchor="middle">im Browser</text>
  <circle class="acc" cx="150" cy="300" r="56" stroke-width="1.4"/>
  <text class="name-acc" x="150" y="296" text-anchor="middle">Konto-</text>
  <text class="name-acc" x="150" y="314" text-anchor="middle">Dienst</text>
  <circle class="paper ink-s" cx="450" cy="300" r="56" stroke-width="1.4"/>
  <text class="name" x="450" y="296" text-anchor="middle">Reservierungs-</text>
  <text class="name" x="450" y="314" text-anchor="middle">Dienst</text>
  <path class="paper ink-s" stroke-width="1.4" d="M46.0,419 V467 A84.0,9 0 0 0 214.0,467 V419 A84.0,9 0 0 0 46.0,419 A84.0,9 0 0 0 214.0,419"/>
  <text class="name" x="130" y="444" text-anchor="middle">Datenbank</text>
  <text class="lbl" x="130" y="462" text-anchor="middle">Konten · Reservierungen</text>
  <path class="paper ink-s" stroke-width="1.4" d="M356.0,419 V467 A84.0,9 0 0 0 524.0,467 V419 A84.0,9 0 0 0 356.0,419 A84.0,9 0 0 0 524.0,419"/>
  <text class="name" x="440" y="444" text-anchor="middle">Cache</text>
  <text class="lbl" x="440" y="462" text-anchor="middle">Zähler · Sperrliste</text>
  <text class="mono" x="40" y="562">Passwort zurücksetzen per Mail: wie in Version 1, hier nicht gezeichnet</text>
  <text class="mono" x="40" y="582">Rechteck = Person oder fremdes System · Kreis = unser Code · Zylinder = Daten</text>
  <text class="mono" x="40" y="602">rot gestrichelt = Trust Boundary: hier wechselt, wer die Kontrolle hat</text>
</svg>
